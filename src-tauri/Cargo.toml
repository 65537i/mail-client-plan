[package]
name = "mail-client"
version = "0.1.0"
description = "A multi-account desktop mail client"
authors = []
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mail_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
smoke-test = []
security-test = [
  "dep:tauri-plugin-wdio",
  "dep:tauri-plugin-wdio-webdriver",
  "dep:rcgen",
  "dep:rustls",
  "dep:tokio",
  "dep:tokio-rustls",
  "dep:keyring",
  "dep:serde",
]
search-poc = ["dep:rusqlite", "dep:unicode-normalization"]
imap-poc = [
  "dep:async-imap",
  "dep:base64",
  "dep:futures-util",
  "dep:rcgen",
  "dep:rustls",
  "dep:tokio",
  "dep:tokio-rustls",
  "async-imap/runtime-tokio",
]
smtp-poc = ["dep:lettre", "dep:tokio", "dep:rcgen", "dep:rustls", "dep:tokio-rustls"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-wdio = { version = "=1.5.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }
rcgen = { version = "=0.14.10", optional = true }
rustls = { version = "=0.23.37", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio = { version = "=1.54.0", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "time"], optional = true }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
rusqlite = { version = "=0.38.0", features = ["bundled"], optional = true }
unicode-normalization = { version = "=0.1.25", optional = true }
async-imap = { version = "=0.12.0", default-features = false, optional = true }
base64 = { version = "=0.23.1", optional = true }
futures-util = { version = "0.3", features = ["io"], optional = true }
lettre = { version = "=0.11.23", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"], optional = true }

[[test]]
name = "tls_auth_boundary"
path = "tests/security/tls_auth_boundary.rs"
required-features = ["security-test"]

[[test]]
name = "japanese_trigram_search"
path = "tests/search/japanese_trigram.rs"
required-features = ["search-poc"]

[[test]]
name = "imap_candidate"
path = "tests/protocol/imap_candidate.rs"
required-features = ["imap-poc"]

[[test]]
name = "smtp_candidate"
path = "tests/protocol/smtp_candidate.rs"
required-features = ["smtp-poc"]
